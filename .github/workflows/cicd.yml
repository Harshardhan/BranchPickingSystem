name: CI with k3d (BranchPickingSystem)

on:
  push:
    branches: ["main"]

jobs:
  ci-k3d:
    runs-on: ubuntu-latest

    steps:
    # -------------------------
    # Checkout
    # -------------------------
    - name: Checkout repository
      uses: actions/checkout@v4

    # -------------------------
    # Java + Maven
    # -------------------------
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: 17
        distribution: temurin

    - name: Build Maven modules
      run: mvn clean package -DskipTests

    # -------------------------
    # Install k3d
    # -------------------------
    - name: Install k3d
      run: |
        curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash
        k3d version

    # -------------------------
    # Create k3d cluster
    # -------------------------
    - name: Create k3d cluster
      run: |
        k3d cluster create branchpickingsystem \
          --agents 2 \
          --wait
        kubectl get nodes

    # -------------------------
    # Build images + import into k3d
    # -------------------------
    - name: Build & import Docker images
      run: |
        SERVICES=(
          "config-server"
          "eureka-server"
          "order-service"
          "analytics-service"
          "payment-service"
          "product-service"
          "notification-service"
          "user-registration"
          "consolidation-service"
          "api-gateway"
        )

        MODULES=(
          "ConfigServerApp"
          "EurekaServerApp"
          "OrderServiceApplication"
          "AnalyticsService"
          "PaymentApplication"
          "ProductServiceApplication"
          "NotificationService"
          "UserRegistration"
          "ConsolidationService"
          "API-Gateway"
        )

        for i in "${!SERVICES[@]}"; do
          echo "Building ${SERVICES[$i]} from ${MODULES[$i]}"
          docker build -t ${SERVICES[$i]}:ci ./${MODULES[$i]}
          k3d image import ${SERVICES[$i]}:ci -c branchpickingsystem
        done

    # -------------------------
    # Deploy Kubernetes manifests
    # -------------------------
    - name: Deploy to k3d
      run: |
        kubectl apply -f k8s/
        kubectl get pods -o wide

    # -------------------------
    # Verify
    # -------------------------
    - name: Verify deployments
      run: |
        kubectl get deployments
        kubectl get svc
