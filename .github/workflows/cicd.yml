name: Branch Picking System CI-CD

on:
  push:
    branches:
      - main

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ DockerHub Login
      - name: DockerHub Login
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login \
          -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      # =========================
      # 3️⃣ BUILD & PUSH IMAGES
      # =========================

      - name: Build & Push Eureka Server
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/eureka-server:latest EurekaServerApp
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/eureka-server:latest

      - name: Build & Push API Gateway
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/api-gateway:latest API-Gateway
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/api-gateway:latest

      - name: Build & Push Config Server
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/config-server:latest ConfigServerApp
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/config-server:latest

      - name: Build & Push Order Service
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/order-service:latest OrderServiceApplication
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/order-service:latest

      - name: Build & Push Product Service
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/product-service:latest ProductServiceApplication
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/product-service:latest

      - name: Build & Push Payment Service
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/payment-service:latest PaymentApplication
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/payment-service:latest

      - name: Build & Push Notification Service
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/notification-service:latest NotificationService
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/notification-service:latest

      - name: Build & Push Analytics Service
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/analytics-service:latest AnalyticsService
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/analytics-service:latest

      - name: Build & Push Consolidation Service
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/consolidation-service:latest ConsolidationService
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/consolidation-service:latest

      - name: Build & Push User Registration Service
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/user-registration:latest UserRegistration
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/user-registration:latest

      # =========================
      # 4️⃣ DEPLOY TO KUBERNETES
      # =========================

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: v1.31.0

      - name: Setup kubeconfig
        run: |
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > kubeconfig
          export KUBECONFIG=$PWD/kubeconfig
          kubectl get nodes

      - name: Deploy to Kubernetes
        run: |
          export KUBECONFIG=$PWD/kubeconfig
          kubectl apply -f k8s/
