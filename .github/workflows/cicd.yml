name: CI-CD Pipeline

on:
  push:
    branches: ["main"]

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG_CONTENT }}
  PROJECT_NAME: branchpickingsystem
  DOCKER_REGISTRY: docker.io

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # ----------------------------
      # Checkout repository
      # ----------------------------
      - name: Checkout repository
        uses: actions/checkout@v3

      # ----------------------------
      # Set up JDK 17
      # ----------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: temurin

      # ----------------------------
      # Build all Maven modules from root
      # ----------------------------
      - name: Build all Maven modules
        run: mvn clean install -DskipTests

      # ----------------------------
      # Set up Docker Buildx
      # ----------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # ----------------------------
      # Login to Docker Hub
      # ----------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      # ----------------------------
      # Build & Push Docker Images for each service
      # ----------------------------
      - name: Build and push Docker images
        run: |
          services=("ConfigServerApp" "EurekaServerApp" "OrderServiceApplication" "AnalyticsService" "PaymentApplication" "ProductServiceApplication" "NotificationService" "UserRegistration" "ConsolidationService" "API-Gateway")

          for service in "${services[@]}"; do
            service_lc=$(echo "$service" | tr '[:upper:]' '[:lower:]')
            echo "Building Docker image for $service"

            # Build Docker image (JAR now exists)
            docker build -t $DOCKER_REGISTRY/$DOCKERHUB_USERNAME/${PROJECT_NAME}-${service_lc}:$GITHUB_SHA ./$service

            # Push Docker image
            docker push $DOCKER_REGISTRY/$DOCKERHUB_USERNAME/${PROJECT_NAME}-${service_lc}:$GITHUB_SHA
          done

      # ----------------------------
      # Set up kubeconfig
      # ----------------------------
      - name: Set up kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${KUBECONFIG_CONTENT}" > $HOME/.kube/config

      # ----------------------------
      # Deploy to Kubernetes
      # ----------------------------
      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/

          for service in "${services[@]}"; do
            service_lc=$(echo "$service" | tr '[:upper:]' '[:lower:]')
            kubectl set image deployment/$service $service=$DOCKER_REGISTRY/$DOCKERHUB_USERNAME/${PROJECT_NAME}-${service_lc}:$GITHUB_SHA
          done

      # ----------------------------
      # Verify Deployments
      # ----------------------------
      - name: Verify Deployments
        run: kubectl get pods -o wide
