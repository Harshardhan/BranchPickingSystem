name: CI-CD

on:
  push:
    branches: ["main"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ Checkout repo with full history and credentials
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # 2️⃣ Debug: Check Git state
      - name: Debug Git
        run: |
          git status
          git branch -a

      # 3️⃣ Debug: List repo files
      - name: List repo files
        run: ls -R

      # 4️⃣ Log in to GitHub Container Registry
      - name: Log in to GHCR
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin

      # 5️⃣ Build and push all microservice images
      - name: Build and push images
        run: |
          SERVICES=("api-gateway" "config-server" "eureka-server" "product-service" "order-service" "payment-service" "user-registration" "analytics-service" "consolidation-service" "notification-service")

          for SERVICE in "${SERVICES[@]}"; do
            SERVICE_DIR="./$SERVICE"
            if [ ! -d "$SERVICE_DIR" ]; then
              echo "Directory $SERVICE_DIR does not exist! Skipping..."
              continue
            fi

            IMAGE_NAME="ghcr.io/${{ secrets.GHCR_USERNAME }}/$SERVICE:latest"

            echo "🔨 Building image for $SERVICE"
            docker build -t $IMAGE_NAME "$SERVICE_DIR"

            echo "🚀 Pushing image for $SERVICE"
            docker push $IMAGE_NAME
          done

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ Checkout repo with full history and credentials
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # 2️⃣ Debug: Check Git state
      - name: Debug Git
        run: |
          git status
          git branch -a

      # 3️⃣ Setup kubectl
      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      # 4️⃣ K8s login
      - name: K8s login
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config

      # 5️⃣ Apply Kubernetes manifests
      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/
          kubectl get pods
