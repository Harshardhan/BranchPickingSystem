name: CI-CD with k3d (BranchPickingSystem)

on:
  push:
    branches: ["main"]

jobs:
  cd-k3d:
    runs-on: self-hosted

    steps:
    # -------------------------
    # Checkout repository
    # -------------------------
    - name: Checkout repository
      uses: actions/checkout@v4

    # -------------------------
    # Verify Java & Maven
    # -------------------------
    - name: Verify Java & Maven
      run: |
        java -version
        mvn -v

    # -------------------------
    # Build Maven modules
    # -------------------------
    - name: Build Maven modules
      run: mvn clean package -DskipTests

    # -------------------------
    # Verify tools
    # -------------------------
    - name: Verify tools
      run: |
        docker --version
        kubectl version --client
        k3d version

    # -------------------------
    # Setup k3d cluster with local registry
    # -------------------------
    - name: Setup k3d cluster and registry
      shell: powershell
      run: |
        $regName = "registry.localhost"
        $regPort = "5000"
        $clusterName = "branchpickingsystem"

        # Clean existing cluster and registry
        if (k3d cluster list | Select-String $clusterName) { k3d cluster delete $clusterName }
        if (k3d registry list | Select-String $regName) { k3d registry delete $regName }

        # Create registry
        k3d registry create $regName --port $regPort

        # Create cluster with registry linked
        k3d cluster create $clusterName --registry-use $regName:$regPort

        # Verify cluster
        k3d cluster list
        kubectl get nodes

    # -------------------------
    # Build and push Docker images
    # -------------------------
    - name: Build & push Docker images
      shell: powershell
      run: |
        $regName = "registry.localhost"
        $regPort = "5000"
        $registryFull = "${regName}:${regPort}"

        $SERVICES = @(
          "config-server","eureka-server","order-service","analytics-service",
          "payment-service","product-service","notification-service",
          "user-registration","consolidation-service","api-gateway"
        )

        $MODULES = @(
          "ConfigServerApp","EurekaServerApp","OrderServiceApplication",
          "AnalyticsService","PaymentApplication","ProductServiceApplication",
          "NotificationService","UserRegistration","ConsolidationService",
          "API-Gateway"
        )

        for ($i=0; $i -lt $SERVICES.Length; $i++) {
            $imageName = "${registryFull}/${SERVICES[$i]}:ci"
            $modulePath = ".\$($MODULES[$i])"

            Write-Host "Building image $imageName from $modulePath..."
            docker build -t $imageName $modulePath

            Write-Host "Pushing image $imageName to local registry..."
            docker push $imageName
        }

    # -------------------------
    # Deploy Infrastructure Services
    # -------------------------
    - name: Deploy Infrastructure Services
      run: |
        kubectl apply -f k8s/infra/redis.yaml
        kubectl apply -f k8s/infra/kafka.yaml
        kubectl apply -f k8s/config-server.yaml
        kubectl apply -f k8s/eureka-server.yaml
        kubectl apply -f k8s/mysql.yaml

        # Wait for infra pods
        kubectl rollout status deployment/config-server --timeout=300s
        kubectl rollout status deployment/eureka-server --timeout=300s
        kubectl rollout status statefulset/redis --timeout=300s
        kubectl rollout status statefulset/kafka --timeout=300s
        kubectl rollout status deployment/mysql --timeout=300s

    # -------------------------
    # Deploy Microservices Sequentially
    # -------------------------
    - name: Deploy Microservices Sequentially
      shell: powershell
      run: |
        $microservices = @(
          "order-service",
          "payment-service",
          "product-service",
          "analytics-service",
          "notification-service",
          "user-registration",
          "consolidation-service",
          "api-gateway"
        )

        foreach ($svc in $microservices) {
          Write-Host "Deploying $svc..."
          kubectl apply -f "k8s/$svc.yaml"
          kubectl rollout status deployment/$svc --timeout=300s
        }

    # -------------------------
    # Verify all pods & services
    # -------------------------
    - name: Verify Cluster State
      run: |
        kubectl get pods -o wide
        kubectl get svc

    # -------------------------
    # Test Internet Connectivity
    # -------------------------
    - name: Test Internet Access from Cluster
      run: |
        kubectl run test-internet --rm -i --tty --image=alpine -- sh -c "
          apk add --no-cache curl;
          echo 'Testing YouTube...';
          curl -I https://www.youtube.com;
          echo 'Testing Google...';
          curl -I https://www.google.com
        "
