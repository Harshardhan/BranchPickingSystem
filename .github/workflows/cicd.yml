name: CI with k3d (BranchPickingSystem)

on:
  push:
    branches: ["main"]

jobs:
  ci-k3d:
    runs-on: self-hosted

    steps:
    # -------------------------
    # Checkout
    # -------------------------
    - name: Checkout repository
      uses: actions/checkout@v4

    # -------------------------
    # Java + Maven
    # -------------------------
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: 17
        distribution: temurin

    - name: Build Maven modules
      run: mvn clean package -DskipTests
      shell: powershell

    # -------------------------
    # Install k3d (PowerShell)
    # -------------------------
    - name: Install k3d
      run: |
        Invoke-WebRequest -Uri https://raw.githubusercontent.com/k3d-io/k3d/main/install.ps1 -OutFile install.ps1
        .\install.ps1
        k3d version
      shell: powershell

    # -------------------------
    # Create k3d cluster
    # -------------------------
    - name: Create k3d cluster
      run: |
        k3d cluster create branchpickingsystem --agents 2 --wait
        kubectl get nodes -o wide
      shell: powershell

    # -------------------------
    # Build images & import into k3d
    # -------------------------
    - name: Build & import Docker images
      run: |
        $SERVICES = @(
          "config-server", "eureka-server", "order-service", "analytics-service",
          "payment-service", "product-service", "notification-service",
          "user-registration", "consolidation-service", "api-gateway"
        )

        $MODULES = @(
          "ConfigServerApp", "EurekaServerApp", "OrderServiceApplication",
          "AnalyticsService", "PaymentApplication", "ProductServiceApplication",
          "NotificationService", "UserRegistration", "ConsolidationService",
          "API-Gateway"
        )

        for ($i=0; $i -lt $SERVICES.Length; $i++) {
          docker build -t $SERVICES[$i]:ci .\$MODULES[$i]
          k3d image import $SERVICES[$i]:ci -c branchpickingsystem
        }
      shell: powershell

    # -------------------------
    # Deploy Kubernetes manifests
    # -------------------------
    - name: Deploy to k3d
      run: kubectl apply -f k8s/
      shell: powershell

    # -------------------------
    # Wait until Eureka is READY
    # -------------------------
    - name: Wait for Eureka
      run: kubectl rollout status deployment/eureka-server --timeout=120s
      shell: powershell

    # -------------------------
    # Show pod status
    # -------------------------
    - name: Pod status
      run: kubectl get pods -o wide
      shell: powershell

    # -------------------------
    # Show deployments
    # -------------------------
    - name: Deployment status
      run: kubectl get deployments
      shell: powershell

    # -------------------------
    # Show services
    # -------------------------
    - name: Service status
      run: kubectl get svc
      shell: powershell

    # -------------------------
    # Eureka logs
    # -------------------------
    - name: Eureka logs
      run: kubectl logs deploy/eureka-server --tail=50
      shell: powershell
