name: CI-CD

on:
  push:
    branches: ["main"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Repo + Submodules
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2. Log in to Docker Hub
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. Build + Push Images for Each Microservice
      - name: Build & Push Config Server
        run: |
          docker build -f ConfigServerApp/Dockerfile -t ${{ secrets.DOCKER_USERNAME }}/config-server:latest ./ConfigServerApp
          docker push ${{ secrets.DOCKER_USERNAME }}/config-server:latest

      - name: Build & Push API Gateway
        run: |
          docker build -f ApiGateway/Dockerfile -t ${{ secrets.DOCKER_USERNAME }}/api-gateway:latest ./ApiGateway
          docker push ${{ secrets.DOCKER_USERNAME }}/api-gateway:latest

      - name: Build & Push User Registration Service
        run: |
          docker build -f UserRegistrationApp/Dockerfile -t ${{ secrets.DOCKER_USERNAME }}/user-service:latest ./UserRegistrationApp
          docker push ${{ secrets.DOCKER_USERNAME }}/user-service:latest

      - name: Build & Push Product Service
        run: |
          docker build -f ProductServiceApp/Dockerfile -t ${{ secrets.DOCKER_USERNAME }}/product-service:latest ./ProductServiceApp
          docker push ${{ secrets.DOCKER_USERNAME }}/product-service:latest

      - name: Build & Push Order Service
        run: |
          docker build -f OrderServiceApp/Dockerfile -t ${{ secrets.DOCKER_USERNAME }}/order-service:latest ./OrderServiceApp
          docker push ${{ secrets.DOCKER_USERNAME }}/order-service:latest

      - name: Build & Push Payment Service
        run: |
          docker build -f PaymentServiceApp/Dockerfile -t ${{ secrets.DOCKER_USERNAME }}/payment-service:latest ./PaymentServiceApp
          docker push ${{ secrets.DOCKER_USERNAME }}/payment-service:latest

      - name: Build & Push Analytics Service
        run: |
          docker build -f AnalyticsServiceApp/Dockerfile -t ${{ secrets.DOCKER_USERNAME }}/analytics-service:latest ./AnalyticsServiceApp
          docker push ${{ secrets.DOCKER_USERNAME }}/analytics-service:latest

      - name: Build & Push Notification Service
        run: |
          docker build -f NotificationServiceApp/Dockerfile -t ${{ secrets.DOCKER_USERNAME }}/notification-service:latest ./NotificationServiceApp
          docker push ${{ secrets.DOCKER_USERNAME }}/notification-service:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install kubectl
      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      # 3. Apply all manifests (with validate=false to avoid your earlier errors)
      - name: Deploy to Kubernetes
        run: |
          kubectl apply --validate=false -f k8s/
