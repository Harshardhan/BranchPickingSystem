name: CI-CD Pipeline

on:
  push:
    branches: ["main"]

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG_CONTENT }}
  PROJECT_NAME: branchpickingsystem
  DOCKER_REGISTRY: docker.io

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # ----------------------------
    # Checkout
    # ----------------------------
    - name: Checkout repository
      uses: actions/checkout@v3

    # ----------------------------
    # Java
    # ----------------------------
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: 17
        distribution: temurin

    # ----------------------------
    # Maven build (IMPORTANT)
    # ----------------------------
    - name: Build all Maven modules
      run: mvn clean install -DskipTests

    # ----------------------------
    # Docker
    # ----------------------------
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ env.DOCKERHUB_USERNAME }}
        password: ${{ env.DOCKERHUB_TOKEN }}

    # ----------------------------
    # Build & Push Images
    # ----------------------------
    - name: Build and push Docker images
      run: |
        SERVICES=(
          "config-server"
          "eureka-server"
          "order-service"
          "analytics-service"
          "payment-service"
          "product-service"
          "notification-service"
          "user-registration"
          "consolidation-service"
          "api-gateway"
        )

        MODULES=(
          "ConfigServerApp"
          "EurekaServerApp"
          "OrderServiceApplication"
          "AnalyticsService"
          "PaymentApplication"
          "ProductServiceApplication"
          "NotificationService"
          "UserRegistration"
          "ConsolidationService"
          "API-Gateway"
        )

        for i in "${!SERVICES[@]}"; do
          IMAGE=${SERVICES[$i]}
          MODULE=${MODULES[$i]}

          echo "Building $IMAGE from $MODULE"

          docker build \
            -t $DOCKER_REGISTRY/$DOCKERHUB_USERNAME/$PROJECT_NAME-$IMAGE:$GITHUB_SHA \
            ./$MODULE

          docker push \
            $DOCKER_REGISTRY/$DOCKERHUB_USERNAME/$PROJECT_NAME-$IMAGE:$GITHUB_SHA
        done

    # ----------------------------
    # Kubernetes config
    # ----------------------------
    - name: Set up kubeconfig
      run: |
        mkdir -p $HOME/.kube
        echo "${KUBECONFIG_CONTENT}" > $HOME/.kube/config

    # ----------------------------
    # Deploy
    # ----------------------------
    - name: Deploy to Kubernetes
      run: |
        kubectl apply -f k8s/

        SERVICES=(
          "config-server"
          "eureka-server"
          "order-service"
          "analytics-service"
          "payment-service"
          "product-service"
          "notification-service"
          "user-registration"
          "consolidation-service"
          "api-gateway"
        )

        for service in "${SERVICES[@]}"; do
          kubectl set image deployment/$service \
            $service=$DOCKER_REGISTRY/$DOCKERHUB_USERNAME/$PROJECT_NAME-$service:$GITHUB_SHA
        done

    # ----------------------------
    # Verify
    # ----------------------------
    - name: Verify deployments
      run: kubectl get pods -o wide
