name: CI-CD with k3d (BranchPickingSystem)

on:
  push:
    branches: ["main"]

jobs:
  cd-k3d:
    runs-on: self-hosted

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Verify Java & Maven
      run: |
        java -version
        mvn -v

    - name: Build Maven modules
      run: mvn clean package -DskipTests

    - name: Verify tools
      run: |
        docker --version
        kubectl version --client
        k3d version

    # ❌ DO NOT DELETE CLUSTER IN CD
    - name: Ensure k3d cluster exists
      run: |
        k3d cluster list
        kubectl get nodes

    - name: Build & import Docker images
      run: |
        $SERVICES = @(
          "config-server","eureka-server","order-service","analytics-service",
          "payment-service","product-service","notification-service",
          "user-registration","consolidation-service","api-gateway"
        )

        $MODULES = @(
          "ConfigServerApp","EurekaServerApp","OrderServiceApplication",
          "AnalyticsService","PaymentApplication","ProductServiceApplication",
          "NotificationService","UserRegistration","ConsolidationService",
          "API-Gateway"
        )

        for ($i=0; $i -lt $SERVICES.Length; $i++) {
          docker build -t "$($SERVICES[$i]):ci" ".\$($MODULES[$i])"
          k3d image import "$($SERVICES[$i]):ci" -c branchpickingsystem
        }

    - name: Deploy to k3d
      run: kubectl apply -f k8s/

    - name: Wait for Eureka
      run: kubectl rollout status deployment/eureka-server --timeout=180s

    - name: Proof
      run: |
        kubectl get pods -o wide
        kubectl get svc

    # ------------------------------
    # ✅ New Step: Test Internet Access
    # ------------------------------
    - name: Test Internet Access from Cluster
      run: |
        echo "Testing connectivity from a temporary pod..."
        kubectl run test-internet --rm -i --tty --image=alpine -- sh -c "
          apk add --no-cache curl;
          echo 'Testing YouTube...';
          curl -I https://www.youtube.com;
          echo 'Testing Google...';
          curl -I https://www.google.com
        "
