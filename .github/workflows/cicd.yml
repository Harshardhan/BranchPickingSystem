name: CI-CD with k3d (BranchPickingSystem)

on:
  push:
    branches: ["main"]

jobs:
  cd-k3d:
    runs-on: self-hosted

    steps:
    # -------------------------
    # Checkout
    # -------------------------
    - name: Checkout repository
      uses: actions/checkout@v4

    # -------------------------
    # Verify Java & Maven
    # -------------------------
    - name: Verify Java & Maven
      run: |
        java -version
        mvn -v

    # -------------------------
    # Build Maven modules
    # -------------------------
    - name: Build Maven modules
      run: mvn clean package -DskipTests

    # -------------------------
    # Verify tools
    # -------------------------
    - name: Verify tools
      run: |
        docker --version
        kubectl version --client
        k3d version

    # -------------------------
    # Ensure k3d cluster exists
    # -------------------------
    - name: Ensure k3d cluster exists
      run: |
        k3d cluster list
        kubectl get nodes

    # -------------------------
    # Create local registry and build/push images
    # -------------------------
    - name: Build & Push Docker Images to Local Registry
      shell: powershell
      run: |
        $regName = "registry.localhost"
        $regPort = "5000"
        $registryFull = "${regName}:${regPort}"

        # Create registry if not exists
        if (-not (k3d registry list | Select-String $regName)) {
            Write-Host "Creating local registry $registryFull..."
            k3d registry create $registryFull
        } else {
            Write-Host "Local registry $registryFull already exists."
        }

        # Define services and modules
        $SERVICES = @(
          "config-server","eureka-server","order-service","analytics-service",
          "payment-service","product-service","notification-service",
          "user-registration","consolidation-service","api-gateway"
        )

        $MODULES = @(
          "ConfigServerApp","EurekaServerApp","OrderServiceApplication",
          "AnalyticsService","PaymentApplication","ProductServiceApplication",
          "NotificationService","UserRegistration","ConsolidationService",
          "API-Gateway"
        )

        # Build & push images
        for ($i=0; $i -lt $SERVICES.Length; $i++) {
            $imageName = "${registryFull}/${SERVICES[$i]}:ci"
            $modulePath = ".\$($MODULES[$i])"

            Write-Host "Building image $imageName from path $modulePath..."
            docker build -t $imageName $modulePath

            Write-Host "Pushing image $imageName to local registry..."
            docker push $imageName
        }

    # -------------------------
    # Deploy to k3d
    # -------------------------
    - name: Deploy to k3d
      run: kubectl apply -f k8s/

    - name: Wait for Eureka
      run: kubectl rollout status deployment/eureka-server --timeout=180s

    - name: Proof
      run: |
        kubectl get pods -o wide
        kubectl get svc

    # -------------------------
    # Test Internet Connectivity
    # -------------------------
    - name: Test Internet Access from Cluster
      run: |
        kubectl run test-internet --rm -i --tty --image=alpine -- sh -c "
          apk add --no-cache curl;
          echo 'Testing YouTube...';
          curl -I https://www.youtube.com;
          echo 'Testing Google...';
          curl -I https://www.google.com
        "
