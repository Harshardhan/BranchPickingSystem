name: CI-CD

on:
  push:
    branches: ["main"]

jobs:

  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true  # include ConfigRepo submodule if needed

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push microservice images
        run: |
          # List of services
          SERVICES=("ConfigServerApp" "EurekaServerApp" "API-Gateway" "OrderServiceApplication" "NotificationService" "ProductServiceApplication" "ConsolidationService" "Common-Library" "UserRegistration" "PaymentApplication" "AnalyticsService")

          for SERVICE in "${SERVICES[@]}"; do
            IMAGE_NAME="ghcr.io/${{ secrets.GHCR_USERNAME }}/$SERVICE:latest"
            echo "Building $SERVICE"

            # Build Docker image using repo root as context
            docker build \
              -f $SERVICE/Dockerfile \
              -t $IMAGE_NAME \
              .

            echo "Pushing $SERVICE image"
            docker push $IMAGE_NAME
          done

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/
          kubectl get pods
