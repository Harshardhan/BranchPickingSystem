name: CI - Build & Push Eureka

on:
  push:
    branches: ["main"]

env:
  IMAGE_NAME: harsha79/eureka-server

jobs:
  build:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build JAR
        run: mvn clean package -DskipTests

      - name: Docker Login
        run: docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Image
        run: |
          SHA=$(git rev-parse --short HEAD)
          echo "Building image: $SHA"

          docker build -t $IMAGE_NAME:ci -t $IMAGE_NAME:$SHA .
          docker push $IMAGE_NAME:ci
          docker push $IMAGE_NAME:$SHA
