name: CI - Build & Push Eureka

on:
  push:
    branches: ["main"]

env:
  IMAGE_NAME: harsha79/eureka-server

jobs:
  build:
    runs-on: self-hosted

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3️⃣ Build JAR
      - name: Build application
        shell: powershell
        run: |
          mvn clean package -DskipTests

      # 4️⃣ Docker Login
      - name: Docker Login
        shell: powershell
        run: |
          docker login `
            -u "${env:DOCKERHUB_USERNAME}" `
            -p "${env:DOCKERHUB_TOKEN}"

      # 5️⃣ Build & Push Docker Image
      - name: Build & Push Docker Image
        shell: powershell
        run: |
          $SHA = git rev-parse --short HEAD
          echo "Building image with tag: $SHA"

          docker build `
            -t "${env:IMAGE_NAME}:ci" `
            -t "${env:IMAGE_NAME}:$SHA" `
            .

          docker push "${env:IMAGE_NAME}:ci"
          docker push "${env:IMAGE_NAME}:$SHA"
