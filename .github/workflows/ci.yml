name: CI - Build & Push Eureka

on:
  push:
    branches: ["main"]

env:
  IMAGE_NAME: harsha79/eureka-server

jobs:
  build:
    runs-on: self-hosted

    steps:
    # -------------------------
    # Checkout
    # -------------------------
    - name: Checkout repository
      uses: actions/checkout@v4

    # -------------------------
    # Java Setup
    # -------------------------
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    # -------------------------
    # Build JAR
    # -------------------------
    - name: Build JAR
      shell: powershell
      run: |
        mvn clean package -DskipTests

    # -------------------------
    # Docker Login
    # -------------------------
    - name: Docker login
      shell: powershell
      run: |
        docker login `
          -u "${{ secrets.DOCKERHUB_USERNAME }}" `
          -p "${{ secrets.DOCKERHUB_TOKEN }}"

    # -------------------------
    # Build & Push Image
    # -------------------------
    - name: Build & Push Docker image
      shell: powershell
      run: |
        $sha = "${{ github.sha }}"

        Write-Host "Building image: $env:IMAGE_NAME:$sha"

        docker build `
          --platform linux/amd64 `
          -t $env:IMAGE_NAME:$sha `
          -t $env:IMAGE_NAME:latest `
          .

        docker push $env:IMAGE_NAME:$sha
        docker push $env:IMAGE_NAME:latest
