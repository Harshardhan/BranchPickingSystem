name: CI - Build All Microservices

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: docker.io
  IMAGE_TAG: ${{ github.sha }}

jobs:
  ci:
    runs-on: self-hosted

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Maven Build (All modules)
      shell: powershell
      run: mvn clean package -DskipTests

    - name: Docker Login
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # ---------------- Build & Push Services ----------------
    - name: Build and Push Microservices
      shell: powershell
      run: |
        $services = @{
            "order-service" = "OrderServiceApplication"
            "product-service" = "ProductServiceApplication"
            "payment-service" = "PaymentApplication"
            "analytics-service" = "AnalyticsService"
            "notification-service" = "NotificationService"
            "user-registration" = "UserRegistration"
            "consolidation-service" = "ConsolidationService"
            "api-gateway" = "API-Gateway"
            "config-server" = "ConfigServerApp"
            "eureka-server" = "EurekaServerApp"
        }

        foreach ($svc in $services.Keys) {
            $path = $services[$svc]
            Write-Host "Building and pushing $svc from $path..."
            docker build -t "${env:REGISTRY}/${{ secrets.DOCKERHUB_USERNAME }}/${svc}:${env:IMAGE_TAG}" $path
            docker push "${env:REGISTRY}/${{ secrets.DOCKERHUB_USERNAME }}/${svc}:${env:IMAGE_TAG}"
        }
