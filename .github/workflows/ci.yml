name: CI - Build All Microservices

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  REGISTRY: docker.io
  IMAGE_TAG: ${{ github.sha }}

jobs:
  ci:
    runs-on: self-hosted

    steps:
    # ---------------- Checkout ----------------
    - name: Checkout source
      uses: actions/checkout@v4

    # ---------------- Java ----------------
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: "17"
        distribution: "temurin"

    # ---------------- Maven ----------------
    - name: Maven Build (All modules)
      shell: powershell
      run: mvn clean package -DskipTests

    # ---------------- Docker Login ----------------
    - name: Docker Login
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # ---------------- Build & Push Images ----------------
    - name: Build and Push Microservices
      shell: powershell
      run: |
        $services = @{
          "eureka-server"          = "EurekaServerApp"
          "config-server"          = "ConfigServerApp"
          "api-gateway"            = "API-Gateway"
          "order-service"          = "OrderServiceApplication"
          "product-service"        = "ProductServiceApplication"
          "payment-service"        = "PaymentApplication"
          "analytics-service"      = "AnalyticsService"
          "notification-service"   = "NotificationService"
          "user-registration"      = "UserRegistration"
          "consolidation-service"  = "ConsolidationService"
        }

        foreach ($svc in $services.Keys) {
          $path = $services[$svc]
          Write-Host "🔨 Building $svc from $path"

          docker build `
            -t "${env:REGISTRY}/${{ secrets.DOCKERHUB_USERNAME }}/$svc:${env:IMAGE_TAG}" `
            -t "${env:REGISTRY}/${{ secrets.DOCKERHUB_USERNAME }}/$svc:ci" `
            $path

          docker push "${env:REGISTRY}/${{ secrets.DOCKERHUB_USERNAME }}/$svc:${env:IMAGE_TAG}"
          docker push "${env:REGISTRY}/${{ secrets.DOCKERHUB_USERNAME }}/$svc:ci"
        }
