name: BranchPickingSystem CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Make Maven Wrapper executable
      run: chmod +x ./mvnw

    - name: Verify root pom.xml exists
      run: ls -l pom.xml

    - name: Show module structure
      run: |
        echo "Current directory:"
        pwd
        echo "Files in root:"
        ls -la
        echo "ConfigServerApp contents:"
        ls -la ConfigServerApp

    - name: Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    - name: Build the entire multi-module project
      run: ./mvnw clean install -DskipTests -B
      working-directory: .

    - name: Run tests
      run: ./mvnw test -B
      working-directory: .
