name: CI - Build All Microservices

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: docker.io
  IMAGE_TAG: ${{ github.sha }}

jobs:
  ci:
    runs-on: self-hosted

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Maven Build (All modules)
      run: mvn clean package -DskipTests

    - name: Docker Login
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # ---------------- ORDER SERVICE ----------------
    - name: Order Service
      run: |
        docker build -t $REGISTRY/${{ secrets.DOCKERHUB_USERNAME }}/order-service:${IMAGE_TAG} ./OrderServiceApplication
        docker push $REGISTRY/${{ secrets.DOCKERHUB_USERNAME }}/order-service:${IMAGE_TAG}

    - name: Product Service
      run: |
        docker build -t $REGISTRY/${{ secrets.DOCKERHUB_USERNAME }}/product-service:${IMAGE_TAG} ./ProductServiceApplication
        docker push $REGISTRY/${{ secrets.DOCKERHUB_USERNAME }}/product-service:${IMAGE_TAG}

    - name: Payment Service
      run: |
        docker build -t $REGISTRY/${{ secrets.DOCKERHUB_USERNAME }}/payment-service:${IMAGE_TAG} ./PaymentApplication
        docker push $REGISTRY/${{ secrets.DOCKERHUB_USERNAME }}/payment-service:${IMAGE_TAG}

    - name: Analytics Service
      run: |
        docker build -t $REGISTRY/${{ secrets.DOCKERHUB_USERNAME }}/analytics-service:${IMAGE_TAG} ./AnalyticsService
        docker push $REGISTRY/${{ secrets.DOCKERHUB_USERNAME }}/analytics-service:${IMAGE_TAG}

    - name: Notification Service
      run: |
        docker build -t $REGISTRY/${{ secrets.DOCKERHUB_USERNAME }}/notification-service:${IMAGE_TAG} ./NotificationService
        docker push $REGISTRY/${{ secrets.DOCKERHUB_USERNAME }}/notification-service:${IMAGE_TAG}

    - name: User Registration Service
      run: |
        docker build -t $REGISTRY/${{ secrets.DOCKERHUB_USERNAME }}/user-registration:${IMAGE_TAG} ./UserRegistration
        docker push $REGISTRY/${{ secrets.DOCKERHUB_USERNAME }}/user-registration:${IMAGE_TAG}

    - name: Consolidation Service
      run: |
        docker build -t $REGISTRY/${{ secrets.DOCKERHUB_USERNAME }}/consolidation-service:${IMAGE_TAG} ./ConsolidationService
        docker push $REGISTRY/${{ secrets.DOCKERHUB_USERNAME }}/consolidation-service:${IMAGE_TAG}

    - name: API Gateway
      run: |
        docker build -t $REGISTRY/${{ secrets.DOCKERHUB_USERNAME }}/api-gateway:${IMAGE_TAG} ./API-Gateway
        docker push $REGISTRY/${{ secrets.DOCKERHUB_USERNAME }}/api-gateway:${IMAGE_TAG}

    - name: Config Server
      run: |
        docker build -t $REGISTRY/${{ secrets.DOCKERHUB_USERNAME }}/config-server:${IMAGE_TAG} ./ConfigServerApp
        docker push $REGISTRY/${{ secrets.DOCKERHUB_USERNAME }}/config-server:${IMAGE_TAG}

    - name: Eureka Server
      run: |
        docker build -t $REGISTRY/${{ secrets.DOCKERHUB_USERNAME }}/eureka-server:${IMAGE_TAG} ./EurekaServerApp
        docker push $REGISTRY/${{ secrets.DOCKERHUB_USERNAME }}/eureka-server:${IMAGE_TAG}
