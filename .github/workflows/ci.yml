name: CI - Build & Push Eureka

on:
  push:
    branches: ["main"]

env:
  IMAGE: harsha79/eureka-server

jobs:
  build:
    runs-on: self-hosted

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Build JAR
      shell: powershell
      run: |
        mvn clean package -DskipTests

    - name: Docker login
      shell: powershell
      run: |
        docker login -u $env:DOCKERHUB_USERNAME -p $env:DOCKERHUB_TOKEN

    - name: Build & Push Docker image
      shell: powershell
      run: |
        # Ensure git safe directory to avoid ownership issues
        git config --global --add safe.directory "$PWD"

        # Get current Git SHA
        $sha = git rev-parse HEAD
        Write-Host "Git SHA: $sha"

        # Build Docker image with 'ci' tag and Git SHA tag
        docker build -t $env:IMAGE:ci -t "$env:IMAGE:$sha" .

        # Push images
        docker push $env:IMAGE:ci
        docker push "$env:IMAGE:$sha"
