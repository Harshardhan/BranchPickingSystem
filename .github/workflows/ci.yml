name: CI - Build & Push Eureka

on:
  push:
    branches: ["main"]

env:
  IMAGE_NAME: harsha79/eureka-server

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build JAR
        shell: powershell
        run: mvn clean package -DskipTests

      - name: Docker login
        shell: powershell
        run: |
          docker login -u $env:DOCKERHUB_USERNAME -p $env:DOCKERHUB_TOKEN

      - name: Build & Push Docker Image
        shell: powershell
        run: |
          # Make repo safe for Git commands
          git config --global --add safe.directory "$PWD"

          # Get current commit SHA
          $sha = git rev-parse HEAD
          Write-Host "Git SHA: $sha"

          # Build and tag Docker image
          docker build -t $env:IMAGE_NAME:ci -t "$env:IMAGE_NAME:$sha" .

          # Push images
          docker push $env:IMAGE_NAME:ci
          docker push "$env:IMAGE_NAME:$sha"
