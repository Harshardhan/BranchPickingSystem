name: CI - Build & Push Eureka

on:
  push:
    branches:
      - main
      - develop

env:
  IMAGE_NAME: harsha79/eureka-server

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Docker login
        shell: powershell
        run: |
          docker login `
            -u "${{ secrets.DOCKERHUB_USERNAME }}" `
            -p "${{ secrets.DOCKERHUB_TOKEN }}"

      - name: Build & Push image
        shell: powershell
        run: |
          git config --global --add safe.directory "$PWD"

          $SHA = git rev-parse --short HEAD
          Write-Host "Building image for commit $SHA"

          docker build `
            -t ${env:IMAGE_NAME}:ci `
            -t ${env:IMAGE_NAME}:$SHA .

          docker push ${env:IMAGE_NAME}:ci
          docker push ${env:IMAGE_NAME}:$SHA
