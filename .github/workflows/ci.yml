name: CI - Build & Push Eureka

on:
  push:
    branches: ["main"]

env:
  IMAGE_NAME: harsha79/eureka-server

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build JAR
        shell: powershell
        run: mvn clean package -DskipTests

      - name: Docker Login
        shell: powershell
        run: |
          docker login `
            -u "${env:DOCKERHUB_USERNAME}" `
            -p "${env:DOCKERHUB_TOKEN}"

      - name: Build & Push Docker Image
        shell: powershell
        run: |
          $SHA = git rev-parse --short HEAD
          echo $SHA > sha.txt

          docker build `
            -t "${env:IMAGE_NAME}:ci" `
            -t "${env:IMAGE_NAME}:$SHA" `
            .

          docker push "${env:IMAGE_NAME}:ci"
          docker push "${env:IMAGE_NAME}:$SHA"

      # ✅ THIS WAS MISSING
      - name: Upload SHA artifact
        uses: actions/upload-artifact@v4
        with:
          name: sha
          path: sha.txt
