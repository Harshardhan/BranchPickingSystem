name: CI - Build & Push Eureka

on:
  push:
    branches: ["main"]

env:
  IMAGE: harsha79/eureka-server

jobs:
  build:
    runs-on: self-hosted

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Build JAR
      shell: powershell
      run: mvn clean package -DskipTests

    - name: Docker login
      shell: powershell
      run: |
        docker login -u $env:DOCKERHUB_USERNAME -p $env:DOCKERHUB_TOKEN

    - name: Build & Push Docker image
      shell: powershell
      run: |
        $sha = "${{ github.sha }}"
        Write-Host "Git SHA: $sha"

        docker build -t $env:IMAGE:ci -t $env:IMAGE:$sha .
        docker push $env:IMAGE:ci
        docker push $env:IMAGE:$sha
