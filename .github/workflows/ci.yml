name: CI - Build & Push Eureka

on:
  push:
    branches: [ "main" ]

env:
  DOCKERHUB_USERNAME: harsha79
  IMAGE_NAME: eureka-server

jobs:
  build:
    runs-on: self-hosted

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Build JAR
      run: mvn clean package -DskipTests

    - name: Docker login
      run: |
        docker login -u ${{ secrets.DOCKERHUB_USERNAME }} `
          -p ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build & Push image
      run: |
        docker build -t harsha79/eureka-server:${{ github.sha }} .
        docker push harsha79/eureka-server:${{ github.sha }}
