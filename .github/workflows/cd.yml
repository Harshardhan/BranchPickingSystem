name: CD - Deploy to k3d Kubernetes

on:
  workflow_run:
    workflows: ["CI - Build All Microservices"]
    types: [completed]

env:
  IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # ---------------- kubectl ----------------
    - name: Install kubectl
      shell: powershell
      run: |
        choco install kubernetes-cli -y

    # ---------------- kubeconfig ----------------
    - name: Configure kubeconfig
      shell: powershell
      run: |
        $kubePath = "$PWD/kubeconfig"
        [IO.File]::WriteAllBytes(
          $kubePath,
          [Convert]::FromBase64String("${{ secrets.KUBECONFIG_B64 }}")
        )
        $env:KUBECONFIG = $kubePath
        kubectl get nodes

    # =====================================================
    # 🔵🟢 EUREKA BLUE–GREEN
    # =====================================================
    - name: Deploy Eureka (Blue-Green)
      shell: powershell
      run: |
        # Apply base resources
        kubectl apply -f k8s/eureka-service.yml
        kubectl apply -f k8s/eureka-blue-deployment.yml
        kubectl apply -f k8s/eureka-green-deployment.yml

        # Detect active color
        $active = kubectl get svc eureka `
          -o jsonpath="{.spec.selector.color}"

        if ($active -eq "blue") {
          $target = "green"
        } else {
          $target = "blue"
        }

        Write-Host "Active=$active → Deploying=$target"

        # Update inactive deployment image
        kubectl set image deployment/eureka-$target `
          eureka-server=${env:DOCKERHUB_USERNAME}/eureka-server:${env:IMAGE_TAG}

        kubectl rollout status deployment/eureka-$target --timeout=180s

        # Switch traffic
        kubectl patch svc eureka `
          -p "{""spec"":{""selector"":{""app"":""eureka"",""color"":""$target""}}}"
