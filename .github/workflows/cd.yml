name: CD - Eureka Blue Green

on:
  workflow_run:
    workflows: ["CI - Build & Push Eureka"]
    types: [completed]

env:
  IMAGE: harsha79/eureka-server
  IMAGE_TAG: ci

jobs:
  deploy:
    runs-on: self-hosted

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Deploy Blue-Green
      shell: powershell
      run: |
        Write-Host "Applying base manifests"
        kubectl apply -f k8s/eureka-server.yml
        kubectl apply -f k8s/eureka-blue.yml
        kubectl apply -f k8s/eureka-green.yml

        Write-Host "Detecting active color"
        $active = kubectl get svc eureka-server `
          -o jsonpath="{.spec.selector.color}"

        if (-not $active) { $active = "blue" }

        if ($active -eq "blue") {
          $target = "green"
        } else {
          $target = "blue"
        }

        Write-Host "Deploying to $target"

        kubectl set image deployment/eureka-$target `
          eureka-server=$env:IMAGE:$env:IMAGE_TAG

        kubectl rollout status deployment/eureka-$target

        Write-Host "Labeling deployment (CI/CD identification)"
        kubectl label deployment eureka-$target `
          deployed-by=github-actions --overwrite

        kubectl annotate deployment eureka-$target `
          github-run-id=${{ github.run_id }} `
          github-actor=${{ github.actor }} `
          github-workflow="${{ github.workflow }}" `
          --overwrite

        Write-Host "Switching service to $target"
        $patch = @{
          spec = @{
            selector = @{
              app = "eureka"
              color = $target
            }
          }
        } | ConvertTo-Json -Depth 5

        kubectl patch svc eureka-server -p $patch
