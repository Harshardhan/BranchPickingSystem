name: CD - Eureka Blue Green

on:
  workflow_run:
    workflows: ["CI - Build & Push Eureka"]
    types: [completed]

env:
  IMAGE_NAME: harsha79/eureka-server

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup kubeconfig
        shell: powershell
        run: |
          $kubeDir = "$env:USERPROFILE\.kube"
          New-Item -ItemType Directory -Force -Path $kubeDir | Out-Null

          $bytes = [Convert]::FromBase64String("${{ secrets.KUBECONFIG_B64 }}")
          [IO.File]::WriteAllBytes("$kubeDir\config", $bytes)

          kubectl get nodes

      - name: Deploy Eureka Blue/Green
        shell: powershell
        run: |
          git config --global --add safe.directory "$PWD"

          $SHA = git rev-parse --short HEAD
          Write-Host "Deploying SHA: $SHA"

          # Ensure base resources exist
          kubectl apply -f k8s/eureka-blue.yml
          kubectl apply -f k8s/eureka-green.yml
          kubectl apply -f k8s/eureka-server.yml

          # Detect active color
          $active = kubectl get svc eureka-server -o jsonpath="{.spec.selector.color}"
          if (-not $active) { $active = "blue" }

          $target = if ($active -eq "blue") { "green" } else { "blue" }

          Write-Host "Active: $active"
          Write-Host "Target: $target"

          # Ensure image exists
          docker pull "${env:IMAGE_NAME}:$SHA"

          # Update deployment image
          kubectl set image `
            deployment/eureka-$target `
            eureka-server="${env:IMAGE_NAME}:$SHA"

          # Add commit label
          kubectl patch deployment eureka-$target `
            --type merge `
            -p "{ `"spec`": { `"template`": { `"metadata`": { `"labels`": { `"commit-sha`": `"$SHA`" }}}}}"

          # Rollout
          kubectl rollout status deployment/eureka-$target

          # Switch traffic
          kubectl patch svc eureka-server `
            -p "{ `"spec`": { `"selector`": { `"app`": `"eureka-server`", `"color`": `"$target`" }}}"

          Write-Host "Deployment completed 🎉"
