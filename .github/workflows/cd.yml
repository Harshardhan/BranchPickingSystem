name: CD - Deploy to k3d Kubernetes

on:
  workflow_run:
    workflows: ["CI - Build All Microservices"]
    types:
      - completed

env:
  IMAGE_TAG: ${{ github.sha }}
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install kubectl
      uses: azure/setup-kubectl@v4
      with:
        version: 'v1.31.0'

    - name: Install k3d
      shell: bash
      run: |
        curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash

    - name: Create k3d cluster (if not exists)
      shell: bash
      run: |
        k3d cluster list | grep branchpickingsystem || \
        k3d cluster create branchpickingsystem --agents 1 --wait

    - name: Configure kubeconfig
      shell: bash
      run: |
        echo "${{ secrets.KUBECONFIG_BASE64 }}" | base64 -d > kubeconfig
        export KUBECONFIG=$PWD/kubeconfig
        kubectl get nodes

    - name: Apply Kubernetes manifests
      shell: bash
      run: |
        kubectl apply -f k8s/

    - name: Update images
      shell: bash
      run: |
        kubectl set image deployment/eureka-server eureka-server=$DOCKERHUB_USERNAME/eureka-server:$IMAGE_TAG
        kubectl set image deployment/config-server config-server=$DOCKERHUB_USERNAME/config-server:$IMAGE_TAG
        kubectl set image deployment/api-gateway api-gateway=$DOCKERHUB_USERNAME/api-gateway:$IMAGE_TAG
        kubectl set image deployment/analytics-service analytics-service=$DOCKERHUB_USERNAME/analytics-service:$IMAGE_TAG
        kubectl set image deployment/notification-service notification-service=$DOCKERHUB_USERNAME/notification-service:$IMAGE_TAG
        kubectl set image deployment/user-registration user-registration=$DOCKERHUB_USERNAME/user-registration:$IMAGE_TAG
        kubectl set image deployment/consolidation-service consolidation-service=$DOCKERHUB_USERNAME/consolidation-service:$IMAGE_TAG
        kubectl set image deployment/order-service order-service=$DOCKERHUB_USERNAME/order-service:$IMAGE_TAG
        kubectl set image deployment/product-service product-service=$DOCKERHUB_USERNAME/product-service:$IMAGE_TAG
        kubectl set image deployment/payment-service payment-service=$DOCKERHUB_USERNAME/payment-service:$IMAGE_TAG

    - name: Verify rollout
      shell: bash
      run: |
        kubectl rollout status deployment/api-gateway
        kubectl rollout status deployment/order-service
