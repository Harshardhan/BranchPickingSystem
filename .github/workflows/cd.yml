name: CD - Eureka Blue/Green

on:
  workflow_run:
    workflows: ["CI - Build & Push Eureka"]
    types: [completed]

env:
  IMAGE_NAME: harsha79/eureka-server

jobs:
  deploy:
    runs-on: self-hosted

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup kubeconfig
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\.kube" | Out-Null
        $bytes = [Convert]::FromBase64String("${{ secrets.KUBECONFIG_B64 }}")
        [IO.File]::WriteAllBytes("$env:USERPROFILE\.kube\config", $bytes)
        kubectl get nodes

    - name: Deploy Eureka Blue-Green
      shell: cmd
      run: |
        REM 1️⃣ Get the current Git SHA
        for /f "delims=" %%i in ('git rev-parse HEAD') do set SHA=%%i
        echo Using Git SHA: %SHA%

        REM 2️⃣ Determine active color
        for /f "tokens=2 delims=:" %%a in ('kubectl get svc eureka-server -o jsonpath="{.spec.selector.color}"') do set ACTIVE=%%a
        if "%ACTIVE%"=="" set ACTIVE=blue

        if "%ACTIVE%"=="blue" (
          set TARGET=green
        ) else (
          set TARGET=blue
        )

        echo Active color: %ACTIVE%
        echo Target color: %TARGET%

        REM 3️⃣ Ensure deployments exist (first time only)
        kubectl apply -f k8s/eureka-blue.yml
        kubectl apply -f k8s/eureka-green.yml
        kubectl apply -f k8s/eureka-server.yml

        REM 4️⃣ Tag & push Docker image
        docker tag %IMAGE_NAME%:ci %IMAGE_NAME%:%SHA%
        docker push %IMAGE_NAME%:%SHA%

        REM 5️⃣ Update Deployment image with SHA
        kubectl set image deployment/eureka-%TARGET% eureka-server=%IMAGE_NAME%:%SHA%

        REM 6️⃣ Patch Deployment pod template with commit SHA label
        kubectl patch deployment eureka-%TARGET% --type merge -p ^
        "{\"spec\":{\"template\":{\"metadata\":{\"labels\":{\"commit-sha\":\"%SHA%\"}}}}}"

        REM 7️⃣ Rollout Deployment
        kubectl rollout restart deployment/eureka-%TARGET%
        kubectl rollout status deployment/eureka-%TARGET%

        REM 8️⃣ Switch service traffic to target color
        kubectl patch svc eureka-server -p ^
        "{\"spec\":{\"selector\":{\"app\":\"eureka-server\",\"color\":\"%TARGET%\"}}}"

        echo Deployment completed successfully!
