name: CD - Deploy to k3d Kubernetes

on:
  workflow_run:
    workflows: ["CI - Build All Microservices"]
    types:
      - completed

env:
  IMAGE_TAG: ${{ github.sha }}
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # ---------------- Install k3d ----------------
    - name: Install k3d
      shell: powershell
      run: |
        choco install k3d -y
        k3d version

    # ---------------- Install kubectl ----------------
    - name: Install kubectl
      shell: powershell
      run: |
        choco install kubernetes-cli -y
        kubectl version --client

    # ---------------- Create k3d cluster if not exists ----------------
    - name: Create k3d cluster
      shell: powershell
      run: |
        $cluster = k3d cluster list | Select-String "branchpickingsystem"
        if (-not $cluster) {
          k3d cluster create branchpickingsystem --agents 1 --wait
        }

    # ---------------- Configure kubeconfig ----------------
    - name: Configure kubeconfig
      shell: powershell
      run: |
        $kubePath = "$PWD/kubeconfig"
        [System.IO.File]::WriteAllBytes($kubePath, [System.Convert]::FromBase64String("${{ secrets.KUBECONFIG_B64 }}"))
        $env:KUBECONFIG = $kubePath
        kubectl config view
        kubectl get nodes

    # ---------------- Apply Kubernetes manifests ----------------
    - name: Apply Kubernetes manifests
      shell: powershell
      run: |
        kubectl apply -f k8s/

    # ---------------- Update deployment images ----------------
    - name: Update deployment images
      shell: powershell
      run: |
        $services = @(
          "eureka-server", "config-server", "api-gateway",
          "analytics-service", "notification-service",
          "user-registration", "consolidation-service",
          "order-service", "product-service", "payment-service"
        )

        foreach ($svc in $services) {
            $image = "${env:DOCKERHUB_USERNAME}/$svc:${env:IMAGE_TAG}"
            kubectl set image deployment/$svc $svc=$image
        }

    # ---------------- Verify rollout ----------------
    - name: Verify rollout
      shell: powershell
      run: |
        foreach ($svc in @("eureka-server","config-server")) {
          kubectl rollout status deployment/$svc
        }
