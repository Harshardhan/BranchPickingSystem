name: CD - Deploy to k3d Kubernetes

on:
  workflow_run:
    workflows: ["CI - Build All Microservices"]
    types: [completed]

env:
  IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # ---------------- Install kubectl ----------------
    - name: Install kubectl
      shell: powershell
      run: |
        choco install kubernetes-cli -y
        kubectl version --client

    # ---------------- Configure kubeconfig ----------------
    - name: Configure kubeconfig
      shell: powershell
      run: |
        $kubePath = "$PWD/kubeconfig"
        [IO.File]::WriteAllBytes(
          $kubePath,
          [Convert]::FromBase64String("${{ secrets.KUBECONFIG_B64 }}")
        )
        $env:KUBECONFIG = $kubePath
        kubectl get nodes

    # =====================================================
    # 🔵🟢 Eureka Blue-Green Deployment
    # =====================================================
    - name: Deploy Eureka (Blue-Green)
      shell: powershell
      run: |
        Write-Host "📦 Applying Eureka base manifests"

        kubectl apply -f k8s/eureka-server.yml
        kubectl apply -f k8s/eureka-blue.yml
        kubectl apply -f k8s/eureka-green.yml

        # Detect active color (default to blue if empty)
        $active = kubectl get svc eureka-server -o jsonpath='{.spec.selector.color}'
        if (-not $active) { $active = "blue" }

        if ($active -eq "blue") { $target = "green" } else { $target = "blue" }

        Write-Host "🔄 Active=$active | Deploying=$target"

        # Update image on inactive deployment
        kubectl set image deployment/eureka-$target `
          eureka="$env:DOCKERHUB_USERNAME/eureka-server:$env:IMAGE_TAG"

        kubectl rollout status deployment/eureka-$target --timeout=300s

        # Switch traffic
        kubectl patch svc eureka-server -p '{"spec":{"selector":{"app":"eureka","color":"'"$target"'"}}}'

        Write-Host "✅ Eureka Blue-Green deployment completed"

    # =====================================================
    # Config Server Deployment (Blue-Green)
    # =====================================================
    - name: Deploy Config Server
      shell: powershell
      run: |
        Write-Host "📦 Applying Config Server manifests"

        kubectl apply -f k8s/config-server.yml
        kubectl apply -f k8s/config-blue.yml
        kubectl apply -f k8s/config-green.yml

        $active = kubectl get svc config-server -o jsonpath='{.spec.selector.color}'
        if (-not $active) { $active = "blue" }

        if ($active -eq "blue") { $target = "green" } else { $target = "blue" }

        Write-Host "🔄 Active=$active | Deploying=$target"

        kubectl set image deployment/config-$target `
          config="$env:DOCKERHUB_USERNAME/config-server:$env:IMAGE_TAG"

        kubectl rollout status deployment/config-$target --timeout=300s

        kubectl patch svc config-server -p '{"spec":{"selector":{"app":"config-server","color":"'"$target"'"}}}'

        Write-Host "✅ Config Server Blue-Green deployment completed"

    # =====================================================
    # API Gateway Deployment
    # =====================================================
    - name: Deploy API Gateway
      shell: powershell
      run: |
        Write-Host "📦 Applying API Gateway manifests"

        kubectl apply -f k8s/api-gateway.yml
        kubectl apply -f k8s/api-gateway-deployment.yml

        kubectl set image deployment/api-gateway `
          api-gateway="$env:DOCKERHUB_USERNAME/api-gateway:$env:IMAGE_TAG"

        kubectl rollout status deployment/api-gateway --timeout=300s

        Write-Host "✅ API Gateway deployment completed"
