name: CD - Deploy to k3d Kubernetes

on:
  workflow_run:
    workflows: ["CI - Build All Microservices"]
    types:
      - completed

env:
  IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # ---------------- Install k3d ----------------
    - name: Install k3d
      shell: powershell
      run: |
        choco install k3d -y
        k3d version

    # ---------------- Install kubectl ----------------
    - name: Install kubectl
      shell: powershell
      run: |
        choco install kubernetes-cli -y
        kubectl version --client

    # ---------------- Create k3d cluster ----------------
    - name: Create k3d cluster
      shell: powershell
      run: |
        if (-not (k3d cluster list | Select-String "branchpickingsystem")) {
          k3d cluster create branchpickingsystem --agents 1 --wait
        }

    # ---------------- Configure kubeconfig ----------------
    - name: Configure kubeconfig
      shell: powershell
      run: |
        $kubePath = "$PWD/kubeconfig"
        [IO.File]::WriteAllBytes($kubePath, [Convert]::FromBase64String("${{ secrets.KUBECONFIG_B64 }}"))
        $env:KUBECONFIG = $kubePath
        kubectl get nodes

    # =====================================================
    # 1️⃣ EUREKA (BASE + BLUE/GREEN)
    # =====================================================
    - name: Deploy Eureka
      shell: powershell
      run: |
        kubectl apply -f k8s/eureka-server.yml
        kubectl apply -f k8s/eureka-server-deployment.yml
        kubectl apply -f k8s/eureka-blue.yml
        kubectl apply -f k8s/eureka-green.yml

        kubectl set image deployment/eureka-server `
          eureka-server=${env:DOCKERHUB_USERNAME}/eureka-server:${env:IMAGE_TAG}

        kubectl rollout status deployment/eureka-server --timeout=180s

    # =====================================================
    # 2️⃣ CONFIG SERVER
    # =====================================================
    - name: Deploy Config Server
      shell: powershell
      run: |
        kubectl apply -f k8s/config-server.yml
        kubectl apply -f k8s/config-server-deployment.yml
        kubectl apply -f k8s/config-blue.yml
        kubectl apply -f k8s/config-green.yml

        kubectl set image deployment/config-server `
          config-server=${env:DOCKERHUB_USERNAME}/config-server:${env:IMAGE_TAG}

        kubectl rollout status deployment/config-server --timeout=180s

    # =====================================================
    # 3️⃣ API GATEWAY
    # =====================================================
    - name: Deploy API Gateway
      shell: powershell
      run: |
        kubectl apply -f k8s/api-gateway.yml
        kubectl apply -f k8s/api-gateway-deployment.yml

        kubectl set image deployment/api-gateway `
          api-gateway=${env:DOCKERHUB_USERNAME}/api-gateway:${env:IMAGE_TAG}

        kubectl rollout status deployment/api-gateway --timeout=180s
