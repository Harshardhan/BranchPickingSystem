name: CD - Deploy to k3d Kubernetes

on:
  workflow_run:
    workflows: ["CI - Build All Microservices"]
    types: [completed]

env:
  IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted

    steps:
    # -------------------------------------------------
    # Checkout
    # -------------------------------------------------
    - name: Checkout repository
      uses: actions/checkout@v4

    # -------------------------------------------------
    # Install kubectl
    # -------------------------------------------------
    - name: Install kubectl
      shell: powershell
      run: |
        choco install kubernetes-cli -y
        kubectl version --client

    # -------------------------------------------------
    # Configure kubeconfig
    # -------------------------------------------------
    - name: Configure kubeconfig
      shell: powershell
      run: |
        $kubePath = "$PWD/kubeconfig"
        [IO.File]::WriteAllBytes(
          $kubePath,
          [Convert]::FromBase64String("${{ secrets.KUBECONFIG_B64 }}")
        )
        $env:KUBECONFIG = $kubePath
        kubectl get nodes

    # =================================================
    # EUREKA - BLUE GREEN DEPLOYMENT
    # =================================================
    - name: Deploy Eureka (Blue-Green)
      shell: powershell
      run: |
        Write-Host "Applying Eureka base manifests"

        kubectl apply -f k8s/eureka-service.yml
        kubectl apply -f k8s/eureka-blue-deployment.yml
        kubectl apply -f k8s/eureka-green-deployment.yml

        # Detect active color
        $active = kubectl get svc eureka `
          -o jsonpath="{.spec.selector.color}"

        if (-not $active) {
          $active = "blue"
        }

        if ($active -eq "blue") {
          $target = "green"
        } else {
          $target = "blue"
        }

        Write-Host "Active=$active | Deploying=$target"

        # Update image on inactive deployment
        kubectl set image deployment/eureka-$target `
          eureka-server="$env:DOCKERHUB_USERNAME/eureka-server:$env:IMAGE_TAG"

        kubectl rollout status deployment/eureka-$target --timeout=300s

        Write-Host "Switching traffic to $target"

        kubectl patch svc eureka `
          -p "{""spec"":{""selector"":{""app"":""eureka"",""color"":""$target""}}}"

        Write-Host "Eureka Blue-Green deployment completed"

    # -------------------------------------------------
    # Verification
    # -------------------------------------------------
    - name: Verify running images
      shell: powershell
      run: |
        kubectl get pods -o=jsonpath="{range .items[*]}{.metadata.name} => {.spec.containers[*].image}`n{end}"
