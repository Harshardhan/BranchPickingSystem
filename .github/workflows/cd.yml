name: CD - Eureka Blue Green

on:
  workflow_run:
    workflows: ["CI - Build & Push Eureka"]
    types:
      - completed

env:
  IMAGE_NAME: harsha79/eureka-server

jobs:
  deploy:
    runs-on: self-hosted

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Deploy Eureka Blue-Green
      shell: powershell
      run: |
        Write-Host "======================================"
        Write-Host " GitHub Actions CD started"
        Write-Host "======================================"

        # Apply ONLY service (do not reapply deployments)
        kubectl apply -f k8s/eureka-server.yml

        # Detect active color
        $active = kubectl get svc eureka-server `
          -o jsonpath="{.spec.selector.color}"

        if (-not $active) { $active = "blue" }

        if ($active -eq "blue") {
          $target = "green"
        } else {
          $target = "blue"
        }

        Write-Host "Active color : $active"
        Write-Host "Target color : $target"

        # Image from CI
        $sha = "${{ github.event.workflow_run.head_sha }}"
        $image = "$env:IMAGE_NAME:$sha"

        Write-Host "Deploying image: $image"

        # Update image
        kubectl set image deployment/eureka-$target `
          eureka-server=$image

        # 🔑 THIS IS THE MOST IMPORTANT PART
        # Patch POD TEMPLATE (not deployment metadata)
        kubectl patch deployment eureka-$target `
          -p '{
            "spec": {
              "template": {
                "metadata": {
                  "labels": {
                    "deployed-by": "github-actions",
                    "commit-sha": "'"$sha"'"
                  }
                }
              }
            }
          }'

        # Wait for rollout
        kubectl rollout status deployment/eureka-$target

        # Switch traffic
        kubectl patch svc eureka-server `
          -p '{"spec":{"selector":{"app":"eureka-server","color":"'"$target"'"}}}'

        Write-Host "======================================"
        Write-Host " Deployment completed successfully"
        Write-Host "======================================"
