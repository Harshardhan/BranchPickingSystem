name: CD - Eureka Blue Green

on:
  push:
    branches: ["main"]

env:
  IMAGE_NAME: harsha79/eureka-server

jobs:
  setup-and-deploy:
    name: Setup Environment & Deploy
    runs-on: self-hosted

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup kubeconfig
      - name: Setup kubeconfig
        shell: powershell
        run: |
          $kubeDir = "$env:USERPROFILE\.kube"
          New-Item -ItemType Directory -Force -Path $kubeDir | Out-Null

          $bytes = [Convert]::FromBase64String("${{ secrets.KUBECONFIG_B64 }}")
          [IO.File]::WriteAllBytes("$kubeDir\config", $bytes)

          Write-Host "Kubeconfig setup complete."
          kubectl get nodes

      # 3️⃣ Download SHA artifact from CI workflow
      - name: Download SHA artifact
        uses: actions/download-artifact@v3
        with:
          name: sha
          path: .

      # 4️⃣ Read SHA
      - name: Read SHA
        shell: powershell
        run: |
          $SHA = Get-Content ./sha.txt
          Write-Host "Deploying SHA: $SHA"

      # 5️⃣ Deploy Blue-Green
      - name: Deploy Eureka Blue/Green
        shell: powershell
        run: |
          # Apply base deployments & service
          kubectl apply -f k8s/eureka-blue.yml
          kubectl apply -f k8s/eureka-green.yml
          kubectl apply -f k8s/eureka-server.yml

          # Detect active color
          $active = kubectl get svc eureka-server -o jsonpath="{.spec.selector.color}"
          if (-not $active) { $active = "blue" }

          $target = if ($active -eq "blue") { "green" } else { "blue" }

          Write-Host "Active color: $active"
          Write-Host "Target color: $target"

          # Pull Docker image
          docker pull "${env:IMAGE_NAME}:$SHA"

          # Update deployment image
          kubectl set image deployment/eureka-$target `
            eureka-server="${env:IMAGE_NAME}:$SHA"

          # Patch deployment to add commit label (here-string JSON)
          $patchDeployment = @"
{
  "spec": {
    "template": {
      "metadata": {
        "labels": {
          "commit-sha": "$SHA"
        }
      }
    }
  }
}
"@
          kubectl patch deployment eureka-$target --type merge -p $patchDeployment

          # Wait for rollout to complete
          kubectl rollout status deployment/eureka-$target

          # Patch service to switch traffic
          $patchService = @"
{
  "spec": {
    "selector": {
      "app": "eureka-server",
      "color": "$target"
    }
  }
}
"@
          kubectl patch svc eureka-server -p $patchService

          Write-Host "Deployment completed 🎉"
