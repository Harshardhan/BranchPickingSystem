name: CD - Eureka Blue Green

on:
  workflow_run:
    workflows: ["CI - Build & Push Eureka"]
    types: [completed]
  workflow_dispatch:

env:
  IMAGE_NAME: harsha79/eureka-server

jobs:
  deploy:
    name: 🚀 Deploy Eureka (Blue-Green)
    runs-on: self-hosted

    steps:
      # 1️⃣ Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Verify runner
      - name: Runner verification
        shell: powershell
        run: |
          echo "Runner Name: $env:RUNNER_NAME"
          echo "Runner Labels: $env:RUNNER_LABELS"

      # 3️⃣ Setup kubeconfig
      - name: Setup kubeconfig
        shell: powershell
        run: |
          $kubeDir = "$env:USERPROFILE\.kube"
          New-Item -ItemType Directory -Force -Path $kubeDir | Out-Null
          $bytes = [Convert]::FromBase64String("${{ secrets.KUBECONFIG_B64 }}")
          [IO.File]::WriteAllBytes("$kubeDir\config", $bytes)
          kubectl get nodes

      # 4️⃣ Download SHA from CI
      - name: Download SHA artifact
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: sha
          path: .

      # 5️⃣ Read SHA
      - name: Read SHA
        id: read-sha
        shell: powershell
        run: |
          if (Test-Path "./sha.txt") {
            $SHA = Get-Content ./sha.txt
          } else {
            $SHA = git rev-parse --short HEAD
          }
          echo "SHA=$SHA"
          "sha=$SHA" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # 6️⃣ Blue-Green Deploy
      - name: Deploy Eureka Blue-Green
        shell: powershell
        run: |
          $SHA = "${{ steps.read-sha.outputs.sha }}"

          kubectl apply -f k8s/eureka-blue.yml
          kubectl apply -f k8s/eureka-green.yml
          kubectl apply -f k8s/eureka-server.yml

          $active = kubectl get svc eureka-server -o jsonpath="{.spec.selector.color}"
          if (-not $active) { $active = "blue" }

          $target = if ($active -eq "blue") { "green" } else { "blue" }

          echo "Active: $active"
          echo "Target: $target"

          docker pull "${env:IMAGE_NAME}:$SHA"

          kubectl set image deployment/eureka-$target `
            eureka-server="${env:IMAGE_NAME}:$SHA"

          kubectl rollout status deployment/eureka-$target

          kubectl patch svc eureka-server --type merge -p "
          {
            \"spec\": {
              \"selector\": {
                \"app\": \"eureka-server\",
                \"color\": \"$target\"
              }
            }
          }
          "

          echo "✅ Eureka deployed successfully"
          
