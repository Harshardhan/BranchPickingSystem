apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
spec:
  replicas: 1   # reduce replicas from 2 → 1 (saves 500MB)
  selector:
    matchLabels:
      app: config-server
  template:
    metadata:
      labels:
        app: config-server
    spec:
      containers:
        - name: config-server
          image: harsha79/config-server:latest
          ports:
            - containerPort: 8888
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
