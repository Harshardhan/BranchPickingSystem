apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: eureka
  template:
    metadata:
      labels:
        app: eureka
    spec:
      containers:
        - name: eureka
          image: 992382454878.dkr.ecr.ap-south-1.amazonaws.com/branchpickingsystem-eureka-server:latest
          ports:
            - containerPort: 8761