apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka-blue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eureka-blue
      color: blue
  template:
    metadata:
      labels:
        app: eureka-blue
        color: blue
        
    spec:
      imagePullSecrets:
        - name: dockerhub-secret
      containers:
        - name: eureka-server
          image: harsha79/eureka-server:ci
          imagePullPolicy: Always
          ports:
            - containerPort: 8761
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
