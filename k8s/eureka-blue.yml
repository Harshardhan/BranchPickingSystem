apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka-blue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eureka-server
      color: blue
  template:
    metadata:
      labels:
        app: eureka-server
        color: blue
    spec:
      imagePullSecrets:
        - name: dockerhub-secret
      containers:
        - name: eureka-server
          image: harsha79/eureka-server:ci
          imagePullPolicy: Always
          ports:
            - containerPort: 8761
