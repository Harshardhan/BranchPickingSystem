apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka-blue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eureka
      color: blue
  template:
    metadata:
      labels:
        app: eureka
        color: blue
    spec:
      containers:
        - name: eureka
          image: harsha79/eureka-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8761
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
