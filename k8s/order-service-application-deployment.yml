apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service-application
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service-application
  template:
    metadata:
      labels:
        app: order-service-application
    spec:
      containers:
        - name: order-service
          image: harsha79/order-service:latest
          
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
