apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service-application
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product-service-application
  template:
    metadata:
      labels:
        app: product-service-application
    spec:
      containers:
        - name: product-service
          image: harsha79/product-service:latest
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret

