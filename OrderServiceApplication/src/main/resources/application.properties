# ===================== ORDER SERVICE =====================
spring.application.name=order-service
spring.profiles.active=default
server.port=8081
spring.config.import=optional:configserver:http://config-server:8888
spring.cloud.config.enabled=false
logging.logstash.enabled=false

spring.cloud.client.discovery.enabled=false
eureka.client.enabled=false
spring.datasource.url=jdbc:mysql://localhost:3306/order_db
spring.datasource.username=root
spring.datasource.password=master
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Kafka bootstrap servers (change to your Kafka host:port)
spring.kafka.bootstrap-servers=localhost:9092

# Optional: other Kafka configs
spring.kafka.consumer.group-id=order-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# Kafka bootstrap server

# Kafka topics
kafka.topic.order=order-topic
kafka.topic.notification=notification-topic
kafka.topic.payment=payment-topic
kafka.topic.analytics=analytics-topic
